name: CI/CD Docker Images

on:
  push:
    branches: [master]
  release:
    types: [published]

jobs:

  validate-readme-versions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate README supported versions
        run: |
          python3 .github/scripts/validate_readme_versions.py versions.json README.md

  resolve-matrix:
    runs-on: ubuntu-latest
    outputs:
      python_versions: ${{ steps.versions.outputs.python_versions }}
      texlive_versions: ${{ steps.versions.outputs.texlive_versions }}
      latest_python_version: ${{ steps.versions.outputs.latest_python_version }}
      latest_texlive_version: ${{ steps.versions.outputs.latest_texlive_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version matrix
        id: versions
        run: |
          python3 .github/scripts/resolve_versions.py versions.json

  build-and-push:
    needs:
      - validate-readme-versions
      - resolve-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python_version: ${{ fromJSON(needs.resolve-matrix.outputs.python_versions) }}
        texlive_version: ${{ fromJSON(needs.resolve-matrix.outputs.texlive_versions) }}
        ffmpeg: [true, false]
        inkscape: [true, false]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute Docker tags
        id: tags
        run: |
          TAG="${{ matrix.python_version }}_${{ matrix.texlive_version }}"
          if [ "${{ matrix.ffmpeg }}" = "true" ]; then TAG="${TAG}-ffmpeg"; fi
          if [ "${{ matrix.inkscape }}" = "true" ]; then TAG="${TAG}-inkscape"; fi

          FULL="jeesoo9595/latex-matplotlib:${TAG}"

          if [ "${{ matrix.python_version }}" = "${{ needs.resolve-matrix.outputs.latest_python_version }}" ] && \
             [ "${{ matrix.texlive_version }}" = "${{ needs.resolve-matrix.outputs.latest_texlive_version }}" ] && \
             [ "${{ matrix.ffmpeg }}" = "true" ] && \
             [ "${{ matrix.inkscape }}" = "true" ]; then
            FULL="${FULL},jeesoo9595/latex-matplotlib:latest"
          fi

          echo "tags=${FULL}" >> "$GITHUB_OUTPUT"

      - name: Log in to DockerHub
        if: github.event_name == 'release'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        run: |
          MIRRORS=(
            "https://ftp.math.utah.edu/pub/tex/historic/"
            "https://texlive.info/historic/"
            "https://ftp.tu-chemnitz.de/pub/tug/historic/"
            "https://pi.kwarc.info/historic/"
            "https://mirrors.tuna.tsinghua.edu.cn/tex-historic-archive/"
            "https://mirror.nju.edu.cn/tex-historic/"
          )

          IFS=',' read -ra TAG_ARRAY <<< "${{ steps.tags.outputs.tags }}"
          TAG_ARGS=()
          for T in "${TAG_ARRAY[@]}"; do
            TAG_ARGS+=("-t" "$T")
          done

          PUSH_FLAG=""
          if [ "${{ github.event_name }}" = "release" ]; then
            PUSH_FLAG="--push"
          fi

          CACHE_SCOPE="py${{ matrix.python_version }}-tl${{ matrix.texlive_version }}-ff${{ matrix.ffmpeg }}-ink${{ matrix.inkscape }}"

          for MIRROR in "${MIRRORS[@]}"; do
            echo "::group::Trying mirror: $MIRROR"
            if docker buildx build \
              --platform linux/amd64,linux/arm64 \
              $PUSH_FLAG \
              "${TAG_ARGS[@]}" \
              --build-arg "PYTHON_VERSION=${{ matrix.python_version }}" \
              --build-arg "TEXLIVE_VERSION=${{ matrix.texlive_version }}" \
              --build-arg "INSTALL_FFMPEG=${{ matrix.ffmpeg }}" \
              --build-arg "INSTALL_INKSCAPE=${{ matrix.inkscape }}" \
              --build-arg "TEX_ARCHIVE=$MIRROR" \
              --cache-from "type=gha,scope=${CACHE_SCOPE}" \
              --cache-to "type=gha,mode=max,scope=${CACHE_SCOPE}" \
              .; then
              echo "::endgroup::"
              echo "Build succeeded with mirror: $MIRROR"
              exit 0
            fi
            echo "::endgroup::"
            echo "::warning::Build failed with mirror: $MIRROR"
          done

          echo "::error::All TeX Live mirrors failed!"
          exit 1
